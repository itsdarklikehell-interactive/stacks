name: Gource visualization

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "gource.mp4"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "gource.mp4"
  workflow_dispatch:

concurrency:
  group: gource-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gource Action
        uses: nbprojekt/gource-action@57256d303cfc? # placeholder
